<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="400" height="90">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield Frame -->
    <path d="M35 5 L65 17 L65 47 C65 62 35 72 35 72 C35 72 5 62 5 47 L5 17 Z" fill="#0F172A" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#neonGlow)"/>
    
    <!-- Inner Lock Padlock Shape -->
    <rect x="22" y="34" width="26" height="22" rx="4" fill="url(#shieldGrad)" />
    <path d="M27 34 V25 C27 20 43 20 43 25 V34" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Lock Keyhole / Flame core -->
    <circle cx="35" cy="43" r="3" fill="#0F172A" />
    <path d="M34 44 L32 50 L38 50 L36 44 Z" fill="#0F172A" />
    
    <!-- Fire Spark on Top Shield -->
    <path d="M35 12 C33 16 31 18 31 21 C31 23.5 32.8 25 35 25 C37.2 25 39 23.5 39 21 C39 18 37 16 35 12 Z" fill="url(#flameGrad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(90, 20)">
    <text x="0" y="24" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="24" letter-spacing="2" fill="#FFFFFF">
      SHROUD'S
    </text>
    <text x="145" y="24" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="24" letter-spacing="2" fill="url(#shieldGrad)">
      LOCKIN
    </text>
    <text x="0" y="48" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="13" letter-spacing="5" fill="#94A3B8">
      DISCIPLINE • CRIB • MASTERY
    </text>
  </g>
</svg>
