{% extends "base.html" %}
{% block title %}Login - {{ app_name }}{% endblock %}

{% block content %}
<div class="container container-sm" style="padding: 2rem 0;">
  <div class="card" style="padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔥</div>
      <h1 style="font-size: 1.8rem; margin-bottom: 0.25rem;">Welcome Back</h1>
      <p style="color: var(--text-secondary); font-size: 0.95rem;">Enter your credentials to lock in today.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="identifier">Username or Email</label>
        <input type="text" id="identifier" name="identifier" class="form-control" placeholder="shroud / user@example.com" value="{{ identifier or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="form-group flex justify-between items-center" style="margin-bottom: 1.5rem;">
        <label class="form-check">
          <input type="checkbox" name="remember" value="1">
          <span style="font-size: 0.85rem; color: var(--text-secondary);">Remember this device</span>
        </label>
      </div>

      <button type="submit" class="btn btn-flame btn-block" style="padding: 0.85rem;">
        🔒 Lock In (Login)
      </button>
    </form>

    <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-secondary);">
      New to the Crib? <a href="{{ url_for('auth.register') }}" style="font-weight: 700; color: var(--accent-cyan);">Create an account</a>
    </div>
  </div>
</div>
{% endblock %}
