{% extends "base.html" %}
{% block title %}Private Profile - {{ app_name }}{% endblock %}

{% block content %}
<div class="container container-sm text-center" style="padding: 4rem 0;">
  <div style="font-size: 3.5rem; margin-bottom: 1rem;">🔒</div>
  <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">This Profile is Private</h1>
  <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.05rem;">
    User <strong>{{ target_user.username }}</strong> has chosen to keep their lock-in history and badges private.
  </p>
  <a href="{{ url_for('community.feed') }}" class="btn btn-secondary">
    Return to Community Feed
  </a>
</div>
{% endblock %}
