{% extends "base.html" %}
{% block title %}403 Access Denied - {{ app_name }}{% endblock %}

{% block content %}
<div class="container container-sm text-center" style="padding: 4rem 0;">
  <div style="font-size: 4rem; margin-bottom: 1rem;">🛡️</div>
  <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;" class="gradient-text">403 - Access Denied</h1>
  <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem;">
    You do not have permission to view or access this resource. Security controls are strictly enforced.
  </p>
  <a href="{{ url_for('dashboard.index' if current_user else 'main.index') }}" class="btn btn-primary">
    Return to Safety
  </a>
</div>
{% endblock %}
