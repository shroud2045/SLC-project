{% extends "base.html" %}
{% block title %}400 Bad Request - {{ app_name }}{% endblock %}

{% block content %}
<div class="container container-sm text-center" style="padding: 4rem 0;">
  <div style="font-size: 4rem; margin-bottom: 1rem;">🚫</div>
  <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;" class="gradient-text">400 - Bad Request</h1>
  <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem;">
    The request could not be processed due to invalid parameters or formatting.
  </p>
  <a href="{{ url_for('dashboard.index' if current_user else 'main.index') }}" class="btn btn-primary">
    Return to Home
  </a>
</div>
{% endblock %}
